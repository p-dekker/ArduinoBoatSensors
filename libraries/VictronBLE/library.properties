sentence=Portable library for reading Victron Energy device data via BLE on ESP32/S3/C3, nRF52 (nRF52840/nRF52832) and Arduino MKR WiFi 1010
paragraph=Read data from Victron SmartSolar, SmartShunt, BMV, inverters, Blue Smart AC chargers and other devices using Bluetooth Low Energy advertisements. Runs on ESP32, ESP32-S3, ESP32-C3, nRF52 (nRF52840, nRF52832 — Bluefruit or Seeed cores) and Arduino MKR WiFi 1010 (via ArduinoBLE) with no external crypto dependency. Supports multiple devices simultaneously with no pairing required.
