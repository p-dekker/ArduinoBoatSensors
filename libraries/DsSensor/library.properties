name=DsSensor
version=1.0.0
author=Patrick Dekker
maintainer=Patrick Dekker
sentence=Self-updating DS18B20 wrapper that keeps outside temperature as internal state.
paragraph=Wraps the DallasTemperature/OneWire libraries behind a setup()/loop() pair, same shape as BmpSensor. loop() starts a conversion every 2000 ms and polls for completion non-blocking, so it never stalls the caller for the ~750 ms a 12-bit conversion takes. Getter returns Kelvin, ready for NMEA 2000, and reports staleness via isValid(), so callers can substitute a not-available value instead of transmitting old readings.
category=Sensors
architectures=*
includes=DsSensor.h
depends=OneWire, DallasTemperature, Sensor
