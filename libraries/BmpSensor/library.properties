name=BmpSensor
version=1.0.0
author=Patrick Dekker
maintainer=Patrick Dekker
sentence=Self-updating BMP280 wrapper that keeps temperature and pressure as internal state.
paragraph=Wraps the Adafruit BMP280 library behind a setup()/loop() pair. loop() refreshes the internal state on a fixed interval (2000 ms by default) and never blocks between updates. Getters return SI units ready for NMEA 2000 (Kelvin, Pascal) and report staleness via isValid(), so callers can substitute a not-available value instead of transmitting old readings.
category=Sensors
architectures=*
includes=BmpSensor.h
depends=Adafruit BMP280 Library, Sensor
