name=VictronBleSensor
version=1.0.0
author=Patrick Dekker
maintainer=Patrick Dekker
sentence=Self-updating wrapper around a Victron BLE battery monitor, keeping battery voltage as internal state.
paragraph=Wraps the VictronBLE library behind a setup()/loop() pair, same shape as BmpSensor/DsSensor. Unlike those, a reading arrives asynchronously whenever the monitored device's BLE advertisement decodes successfully rather than on a fixed poll interval, so isValid() stays false until the first one shows up. Getter returns Volts, ready for NMEA 2000, and reports staleness via isValid(), so callers can substitute a not-available value instead of transmitting old readings.
category=Sensors
architectures=*
includes=VictronBleSensor.h
depends=VictronBLE, Sensor
